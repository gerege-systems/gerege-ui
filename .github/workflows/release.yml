name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Same gates as CI — a publish never runs on a tree that would fail CI.
      - name: Verify
        run: pnpm lint && pnpm typecheck && pnpm test

      - run: pnpm build:lib

      - name: Package checks
        run: pnpm test:treeshake && pnpm publint && pnpm attw && pnpm size

      - name: Create release PR or publish
        # v2: understands @changesets/cli 3's publish output. v1 stopped
        # detecting published packages after the cli 3 upgrade, so no git tag
        # and no GitHub Release was created from 0.12.3 on.
        uses: changesets/action@66d7d1ddafddf1ef45f98ee51a7496f9cdadb2f4 # v2.1.2
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Both env names required: changesets/action reads NPM_TOKEN, but
          # the .npmrc that setup-node writes references NODE_AUTH_TOKEN.
          # Missing the second one makes `npm publish` 404 on PUT.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance (public repo + GitHub Actions OIDC via id-token: write).
          NPM_CONFIG_PROVENANCE: true
