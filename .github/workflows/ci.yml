name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # theme.css ↔ design-research/08-design-tokens.md parity runs against the
      # doc's main branch; the test fails under CI when the doc is missing.
      - name: Check out design-research (token doc)
        uses: actions/checkout@v4
        with:
          repository: gerege-systems/design-research
          path: design-research
          sparse-checkout: 08-design-tokens.md
          sparse-checkout-cone-mode: false

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Coverage thresholds (vitest.config.ts) only bite when coverage runs.
      - name: Test (with coverage thresholds)
        run: pnpm --filter @gerege-systems/ui test:coverage
        env:
          TOKEN_DOC: ${{ github.workspace }}/design-research/08-design-tokens.md

      - name: Build library
        run: pnpm build:lib

      - name: Tree-shake check (dist-lib)
        run: pnpm test:treeshake

      - name: publint
        run: pnpm publint

      - name: Are the types wrong
        run: pnpm attw

      - name: Bundle size budget
        run: pnpm size

      - name: create-app smoke
        run: pnpm test:create-app

      - name: Build showcase
        run: pnpm build

      - name: Generated props are up to date
        run: git diff --exit-code apps/site/src/showcase/registry/generated-props.ts

      - name: Test showcase
        run: pnpm --filter @gerege-systems/site test

  # Library peer range is ^18 || ^19 — typecheck + test the library against React 19.
  # React is overridden for the whole workspace in this job (see step below).
  test-react-19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Override React for the WHOLE workspace: with node-linker=hoisted, adding
      # react@19 only to packages/ui leaves @testing-library/react on a nested
      # react-dom@18 (apps/site pins ^18), which then renders 19-created elements.
      - name: Install React 19 (workspace override)
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.pnpm={...(p.pnpm||{}),overrides:{...((p.pnpm||{}).overrides||{}),react:'19','react-dom':'19','@types/react':'19','@types/react-dom':'19'}};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          pnpm install --no-frozen-lockfile
          node -p "'react-dom ' + require('react-dom/package.json').version"

      - name: Typecheck (React 19)
        run: pnpm --filter @gerege-systems/ui typecheck

      - name: Test (React 19)
        run: pnpm test

  # Showcase E2E (Playwright, chromium). Visual baselines are per-platform and
  # skipped here unless CI_VISUAL=1 — see apps/site/e2e/README.md.
  # Decide whether the Playwright job is worth running for this change.
  e2e-filter:
    runs-on: ubuntu-latest
    # paths-filter lists a PR's files through the API; without this it fails
    # and the e2e job is skipped as if nothing relevant changed.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.f.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            ui:
              - 'packages/ui/src/**'
              - 'packages/ui/package.json'
              - 'apps/site/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  e2e:
    needs: e2e-filter
    if: needs.e2e-filter.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The showcase consumes packages/ui from source — no library build needed.
      - name: Build showcase
        run: pnpm build:site

      - name: Playwright version
        id: pw
        run: echo "v=$(pnpm --filter @gerege-systems/site exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}

      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @gerege-systems/site exec playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @gerege-systems/site exec playwright install-deps chromium

      - name: E2E (shard ${{ matrix.shard }}/2)
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/site/playwright-report
          retention-days: 14
